<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Il nostro Calendario dell'Avvento ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    color: white;
    background:
        radial-gradient(circle at top, #74152b, #26030b 65%, #120107);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(#ffffff 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.15;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 45px 18px 60px;
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 8px 15px;
    border: 1px solid #f6d36a;
    border-radius: 999px;
    color: #f6d36a;
    font: 600 12px Arial;
    letter-spacing: 2px;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(34px, 7vw, 64px);
    margin: 18px 0 10px;
    color: #ffe9a0;
    text-shadow: 0 4px 18px #0008;
}

.subtitle {
    font-size: 18px;
    color: #ffeec1;
    margin-bottom: 40px;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
    max-width: 820px;
    margin: auto;
}

.day {
    position: relative;
    aspect-ratio: 1;
    border: 0;
    background: transparent;
    cursor: pointer;
    transition: 0.25s;
    filter: drop-shadow(0 10px 13px #0008);
}

.day:hover {
    transform: translateY(-7px) scale(1.04);
}

.heart {
    position: absolute;
    inset: 12%;
    background: linear-gradient(145deg, #e72a4e, #8e0d26);
    transform: rotate(-45deg);
    border-radius: 12px 0 12px 0;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: inherit;
    border-radius: 50%;
}

.heart::before {
    top: -50%;
}

.heart::after {
    left: 50%;
}

.number {
    position: relative;
    z-index: 2;
    font-size: clamp(26px, 5vw, 43px);
    font-weight: bold;
    color: #f7d45d;
    text-shadow: 0 2px 6px #3d0710;
}

.locked {
    cursor: not-allowed;
    filter: grayscale(0.5) opacity(0.65);
}

.lock {
    position: absolute;
    z-index: 3;
    bottom: 12%;
    left: 0;
    right: 0;
    font: bold 11px Arial;
    color: #ffeaa3;
}

.modal {
    position: fixed;
    inset: 0;
    background: #090007cc;
    display: none;
    place-items: center;
    padding: 20px;
    z-index: 10;
}

.modal.active {
    display: grid;
}

.card {
    width: min(620px, 100%);
    background: linear-gradient(145deg, #fff9e9, #f7e5bc);
    color: #42101a;
    border: 2px solid #e7bb52;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 25px 80px #0009;
}

.card h2 {
    color: #9b1731;
    font-size: 32px;
}

.card p {
    font-size: 19px;
    line-height: 1.6;
}

.close {
    margin-top: 16px;
    padding: 11px 22px;
    border: 0;
    border-radius: 999px;
    background: #9b1731;
    color: #ffe9a0;
    font-weight: bold;
    cursor: pointer;
}

@media (max-width: 650px) {
    .calendar {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .subtitle {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<main>

<div class="badge">
    Dicembre 2026 ✨
</div>

<h1>
    ♥ Il nostro Calendario dell'Avvento ♥
</h1>

<div class="subtitle">
    24 giorni, 24 piccole sorprese… e un solo grande noi ✨
</div>

<div id="calendar" class="calendar"></div>

</main>

<div id="modal" class="modal">

<div class="card">

<h2 id="modalTitle"></h2>

<p id="modalMessage"></p>

<p id="modalSurprise"></p>

<button class="close" onclick="closeModal()">
    Chiudi ❤️
</button>

</div>

</div>

<script>

const calendar = document.getElementById("calendar");

function isUnlocked(day) {

    const today = new Date();

    const unlockDate =
        new Date(`2026-12-${String(day).padStart(2, "0")}T00:00:00`);

    return today >= unlockDate;
}

const surprises = {

    1: {
        title: "Giorno 1 ❤️",
        message: "Il nostro dicembre comincia qui.",
        surprise: "La prima sorpresa è un sorriso tutto per te ❤️"
    },

    2: {
        title: "Giorno 2 ❤️",
        message: "Ogni giorno con te è un piccolo regalo.",
        surprise: "Oggi ricordati quanto sei speciale."
    },

    3: {
        title: "Giorno 3 ❤️",
        message: "Tre cose belle: tu, noi e tutto quello che ancora dobbiamo vivere.",
        surprise: "Ti amo ❤️"
    }

};

for (let day = 1; day <= 24; day++) {

    const button = document.createElement("button");

    button.className = "day";

    const unlocked = isUnlocked(day);

    if (!unlocked) {
        button.classList.add("locked");
    }

    button.innerHTML = `
        <span class="heart"></span>
        <span class="number">${day}</span>
        ${unlocked ? "" : '<span class="lock">🔒</span>'}
    `;

    button.onclick = () => {

        if (!unlocked) return;

        const surprise = surprises[day] || {

            title: `Giorno ${day} ❤️`,

            message: "Una sorpresa sta aspettando te…",

            surprise: "Torna presto per scoprirla ❤️"

        };

        document.getElementById("modalTitle").textContent =
            surprise.title;

        document.getElementById("modalMessage").textContent =
            surprise.message;

        document.getElementById("modalSurprise").textContent =
            surprise.surprise;

        document.getElementById("modal").classList.add("active");

    };

    calendar.appendChild(button);
}

function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("active");

}

</script>

</body>
</html>
