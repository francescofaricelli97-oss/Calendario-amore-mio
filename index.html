!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Il nostro calendario ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background:
        radial-gradient(circle at top, #fff4c7, transparent 35%),
        linear-gradient(135deg, #7b1630, #c94b62, #f0b45b);
    color: white;
    text-align: center;
    padding: 30px 15px;
}

h1 {
    margin: 10px auto 8px;
    max-width: 800px;
    font-size: clamp(28px, 6vw, 48px);
    line-height: 1.15;
    text-shadow: 0 3px 8px rgba(0,0,0,.3);
}

.subtitle {
    font-size: 18px;
    margin-bottom: 30px;
}

#calendar {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.day {
    position: relative;
    border: none;
    background: transparent;
    cursor: pointer;
    min-height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.heart {
    position: absolute;
    width: 90px;
    height: 90px;
    background: #fff;
    transform: rotate(-45deg);
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,.25);
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 90px;
    height: 90px;
    background: #fff;
    border-radius: 50%;
}

.heart::before {
    top: -45px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 45px;
}

.number {
    position: relative;
    z-index: 2;
    color: #d69b18;
    font-size: 32px;
    font-weight: bold;
}

.lock {
    position: absolute;
    z-index: 3;
    bottom: 8px;
    font-size: 20px;
}

.day:hover .heart {
    transform: rotate(-45deg) scale(1.08);
}

.day.locked {
    cursor: default;
    opacity: .65;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.active {
    display: flex;
}

.modal-box {
    background: linear-gradient(145deg, #fff8df, #fff);
    color: #7b1630;
    width: min(500px, 100%);
    padding: 35px 25px;
    border-radius: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,.4);
    position: relative;
}

.modal-box h2 {
    margin-top: 0;
    font-size: 30px;
}

.modal-box p {
    font-size: 18px;
    line-height: 1.5;
}

.surprise {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: #fff1b8;
    font-weight: bold;
}

.close {
    margin-top: 25px;
    border: none;
    border-radius: 20px;
    padding: 10px 25px;
    background: #7b1630;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

@media (max-width: 600px) {

    #calendar {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .day {
        min-height: 105px;
    }

    .heart,
    .heart::before,
    .heart::after {
        width: 70px;
        height: 70px;
    }

    .heart::before {
        top: -35px;
    }

    .heart::after {
        left: 35px;
    }

    .number {
        font-size: 25px;
    }
}

</style>
</head>

<body>

<h1>Ti amo più di ieri e meno di domani amore mio ❤️</h1>

<div class="subtitle">
    Il nostro piccolo calendario dell'amore 🎄❤️
</div>

<div id="calendar"></div>

<div id="modal" class="modal">

    <div class="modal-box">

        <h2 id="modalTitle"></h2>

        <p id="modalMessage"></p>

        <div id="modalSurprise" class="surprise"></div>

        <button class="close" onclick="closeModal()">
            Chiudi ❤️
        </button>

    </div>

</div>

<script>

const calendar = document.getElementById("calendar");

const surprises = {

    1: {
        title: "Giorno 1 ❤️",
        message: "Il nostro dicembre comincia qui.",
        surprise: "La prima sorpresa è un sorriso tutto per te ❤️"
    },

    2: {
        title: "Giorno 2 ❤️",
        message: "Ogni giorno con te è un piccolo regalo.",
        surprise: "Oggi ricordati quanto sei speciale."
    },

    3: {
        title: "Giorno 3 ❤️",
        message: "Tre cose belle: tu, noi e tutto quello che ancora dobbiamo vivere.",
        surprise: "Ti amo ❤️"
    }

};

function isUnlocked(day) {

    const now = new Date();

    // Per ora tutti i giorni sono cliccabili
    // così possiamo verificare che il calendario funzioni.
    return true;
}

for (let day = 1; day <= 24; day++) {

    const button = document.createElement("button");

    button.className = "day";

    const unlocked = isUnlocked(day);

    if (!unlocked) {
        button.classList.add("locked");
    }

    button.innerHTML = `
        <span class="heart"></span>
        <span class="number">${day}</span>
        ${unlocked ? "" : '<span class="lock">🔒</span>'}
    `;

    button.onclick = () => {

        if (!unlocked) return;

        const surprise = surprises[day] || {

            title: `Giorno ${day} ❤️`,

            message: "Una sorpresa sta aspettando te…",

            surprise: "Torna presto per scoprirla ❤️"

        };

        document.getElementById("modalTitle").textContent =
            surprise.title;

        document.getElementById("modalMessage").textContent =
            surprise.message;

        document.getElementById("modalSurprise").textContent =
            surprise.surprise;

        document.getElementById("modal").classList.add("active");

    };

    calendar.appendChild(button);
}

function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("active");

}

</script>

</body>
</html>
